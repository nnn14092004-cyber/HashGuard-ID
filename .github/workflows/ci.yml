name: HashGuard-ID Security & Cryptographic Invariants CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-verify:
    name: Cryptographic Verification & Concurrency Harness
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5

    steps:
      - name: 1. Checkout Codebase
        uses: actions/checkout@v4

      - name: 2. Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 3. Setup Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 4. Check Code Formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: 5. Verify Zero-Warning Linting (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: 6. Verify Documentation Synchronization
        run: python scripts/generate_readme.py --check

      - name: 7. Native Cryptographic Invariants Test Suite
        run: cargo test --all -- --nocapture

      - name: 8. Build Production Edge Gateway
        run: cargo build --release --bin gateway

      - name: 9. Start Background Gateway Daemon
        run: |
          REDIS_URL="redis://127.0.0.1:6379" target/release/gateway &
          sleep 3

      - name: 10. Concurrency & TOCTOU Audit (50 Racing Threads)
        run: python scripts/test_gateway_concurrency.py

      - name: 11. Mobile Packet-Loss Desync & Silent Rollover Audit
        run: python scripts/test_lookahead_recovery.py

      - name: 12. Adversarial Negative-Space Audit (Replay, Tampering, Forgery)
        run: python scripts/adversarial_simulation.py

      - name: 13. Hardcore Commercial Chaos Suite (Welch's t-test, Rollover Race)
        run: python scripts/chaos_adversarial_suite.py

      - name: 14. Realistic WAN & Cellular Simulation (Jitter, Packet-Loss, Endurance)
        run: python scripts/realistic_wan_simulation.py

      - name: 15. Full SLA Benchmark & Latency Budget Verification (N = 500)
        run: python scripts/benchmark_sla.py